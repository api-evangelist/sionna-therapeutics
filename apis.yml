name: Sionna Therapeutics
description: 'Sionna Therapeutics, Inc. (Nasdaq: SION) is a clinical-stage biopharmaceutical
  company headquartered at 21 Hickory Drive, Waltham, Massachusetts, working to revolutionize the
  treatment paradigm for cystic fibrosis (CF) by developing novel small molecules that normalize the
  function of the cystic fibrosis transmembrane conductance regulator (CFTR) protein. Building on more
  than a decade of its co-founders'' research, the company advances a pipeline of first-in-class
  stabilizers of CFTR''s nucleotide-binding domain 1 (NBD1) — the domain that carries F508del, the most
  common CF-causing mutation — including SION-719 and SION-451, alongside a portfolio of complementary
  CFTR modulators such as SION-2222 (galicaftor) and SION-109 designed to work synergistically with the
  NBD1 stabilizers. Sionna operates purely as a drug-development organization: its public web presence
  is a nine-page WordPress marketing site covering science, pipeline, careers, contact and legal
  material, plus a hosted investor-relations portal. It publishes no developer program, public API,
  SDK, webhook surface, or machine-readable specification of any kind.'
